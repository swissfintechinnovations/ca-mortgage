description: All relevant details of a specific item that is part of a financial institution's (FI) offer for a mortgage product, including product details, tranche ID, and conditions.
type: object
required:
  - offerItemId
  - product
  - trancheId
properties:
  offerItemId:
    type: string
    format: uuid
    example: d452083f-8316-410d-a609-d49463687329
    description: Uuid v4 of the specific offer item.
  product:
    $ref: ./Product.yaml
  trancheId:
    type: string
    format: uuid
    description: The unique identifier (UUID) for the tranche associated with the offer item.
    example: 51b017e1-5e59-4b58-a0a0-c638c87db463
  conditions:
    description: A list of conditions associated with the offer item.
    type: array
    items:
      $ref: ./Condition.yaml
