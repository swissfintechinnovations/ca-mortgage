description: All information required to select a specific mortgage offer and place a binding order.
type: object
required:
  - offerId
properties:
  offerId:
    $ref: ./OfferId.yaml
    description: The unique identifier (UUID) of the selected offer.
  applicationId:
    $ref: ./ApplicationId.yaml
    description: The unique identifier (UUID) of the mortgage application.
  mortgageId:
    $ref: ./MortgageId.yaml
    description: he unique identifier (UUID) of the mortgage.
  orderId:
    $ref: ./OrderId.yaml
    description: The unique identifier (UUID v4) of the order as defined by the financial institution (FI).
  remark:
    type: string
    example: All documents verified at TPP
    description: A remark or comment that can be added by the Third-Party Provider (TPP), such as notes about the verification or documentation process.
