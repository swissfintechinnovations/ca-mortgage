description: 'Asset information: An array of all assets the applicant possesses, including those that will be used for the financial request.'
type: object
required:
  - amount
  - assetType
properties:
  amount:
    $ref: ./Amount.yaml
    description: |
     The value of the asset, such as the market value of a fungible investment, the current retirement asset in a pension fund, or the surrender value of life insurance.
  assetType:
    $ref: ./AssetType.yaml
  assetProvider:
    $ref: ./AssetProvider.yaml
  insuranceSum:
    $ref: ./Amount.yaml
    description: The insured amount in a life insurance policy.
  remark:
    type: string
    description: Additional notes or comments regarding the asset.
    example: This asset is tied to a long-term pension plan with a guaranteed return.
