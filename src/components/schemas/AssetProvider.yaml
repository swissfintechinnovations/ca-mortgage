description: |
  The asset provider for each asset. Additional information must be provided depending on the asset type. For example, if the applicant owns an insurance policy, the name of the insurance company should be included.
type: object
required:
  - name
properties:
  name:
    type: string
    example: Credit Suisse
    description: The name of the asset provider, such as a bank, insurance company, or financial institution.
