title: Structured Address
description:  A structured format for representing an address, including country, postcode, street name, and town name.
type: object
required:
  - country
  - postCode
  - streetName
  - townName
properties:
  country:
    type: string
    maxLength: 2
    example: CH
    description: The country or political area, typically defined by borders, which can be natural (e.g., rivers or mountains) or artificial (e.g., political boundaries).
  postCode:
    type: string
    maxLength: 16
    description: The postal code or ZIP code for the address.
    example: CH-2501
  streetName:
    type: string
    maxLength: 70
    example: Rue de la gare
    description: The name of the street or road in the address.
  townName:
    type: string
    maxLength: 35
    example: Biel
    description: The name of the town, city, or locality.
  buildingNumber:
    type: string
    maxLength: 16
    example: 24A
    description: The specific building or house number within the street.
