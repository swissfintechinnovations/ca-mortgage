description: An object containing a link to an external resource along with its description and optional name.
type: object
required:
  - url
properties:
  url:
    description: The URL pointing to the external resource.
    type: string
    format: uri
    minLength: 2
    example: http://www.example.com/property.png
  description:
    description: A brief description of the external resource.
    type: string
    example: The image shows the aerial view of the property
  name:
    description: The name of the external resource.
    type: string
    example: Property image
