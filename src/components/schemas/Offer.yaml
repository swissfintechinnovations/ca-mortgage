description: All relevant details describing the financial institution's (FI) offer for a mortgage product, including offer ID, requested financing, and validity.
type: object
required:
  - financingRequestId
  - offerId
  - offerItems
  - totalAmount
  - validTo
properties:
  financingRequestId:
    $ref: ./FinancingRequestId.yaml
  offerId:
    $ref: ./OfferId.yaml
  offerItems:
    description: A list of individual offer items or components included in the mortgage offer.
    type: array
    items:
      $ref: ./OfferItem.yaml
  totalAmount:
    $ref: ./Amount.yaml
  validTo:
    $ref: ./generic/Date.yaml
  offerType:
    type: string
    description: The type of offer—whether it is binding or indicative.
    example: binding
    enum:
      - binding
      - indicative
