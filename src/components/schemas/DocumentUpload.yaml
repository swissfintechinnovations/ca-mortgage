description: Document to upload with metadata, including details about the document file and its current status.
type: object
required:
  - documentList
properties:
  documentList:
    type: array
    items:
      type: object
      properties:
        filename:
          type: string
          example: customer_id.pdf
        filetype:
          type: string
          example: pdf
        documentId:
          type: string
          format: uuid
          example: 7f648f12-fd45-4930-6543-456hf5671c37
          description: A unique identifier for the document, in UUID v4 format.
        filesize:
          type: integer
          example: 1024
          description: The size of the document file in bytes.
        uploaddate:
          $ref: ./generic/Date.yaml
        statusInfo:
          description: Information about the current status of the document.
          type: object
          required:
            - status
          properties:
            status:
              type: string
              example: pending
              enum:
                - accepted
                - rejected
                - pending
              default: pending
              description: The current processing status of the document.
            statusReason:
              type: string
              example: Additional information that can be shared with the status.
              description: A reason explaining the current status of the document (e.g., additional information or approval required).
