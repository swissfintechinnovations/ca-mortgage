description: |
  The details representing a real estate object, including various identifiers and attributes such as the address, property type, and construction information. 
  The real estate register ID (propertyIdentifier) is optional unless required by law.
type: object
required:
  - address
  - propertyObjectId
properties:
  address:
    $ref: ./StructuredAddress.yaml
  propertyObjectId:
    type: string
    description: The unique identifier for the property object defined by the third-party provider (TPP).
    example: 9343dd26-4b54-4808-8978-538f8e869d0e
  buildingRight:
    type: object
    description: A building right is a time-limited right to construct a building on land that is not owned by the builder, meaning the builder owns only the building, not the land it is built on.
    properties:
      hasBuildingRight:
        type: boolean
        description: Indicates whether the property is built under a building right. True if the property is built on a building right, otherwise false.
        example: false
      buildingRightExpiry:
        $ref: ./generic/Date.yaml
        description: The date when the building right expires.
      buildingRightRent:
        $ref: ./Amount.yaml
        description: The yearly payment for the building right.
      buildingRightCompensation:
        $ref: ./Amount.yaml
        description: The compensation paid when the building right expires.
  buildingStandardBathroom:
    type: string
    enum:
      - premium
      - highlevel
      - basic
      - lowlevel
    description: The building standard of the bathroom fixtures and fittings.
    example: basic
  buildingStandardFloorCoverings:
    type: string
    enum:
      - premium
      - highlevel
      - basic
      - lowlevel
    description: The building standard of the floor coverings.
    example: basic
  buildingStandardKitchen:
    type: string
    enum:
      - premium
      - highlevel
      - basic
      - lowlevel
    description: The building standard of the kitchen fittings and appliances.
    example: basic
  ceilingHight:
    type: string
    enum:
      - especially_high
      - middle
      - especially_low
    description: The ceiling hight of the rooms.
    example: middle
  classOfProperty:
    type: string
    enum:
      - main_residence
      - main_residence_with_use_restriction
      - second_residence
      - second_residence_with_use_restriction
      - rented_property
      - rented_property_with_use_restriction
      - other
    description: The classification of the property, such as main residence, second residence, or rented property.
    example: main_residence
  collateralValue:
    $ref: ./Amount.yaml
    description: The value of the property used for securing the mortgage, applying the lowest value principle (Belehnungsbasis).
  estimation:
    type: object
    description: The estimation of the value of a property provided by an external source.
    properties:
      estimationId:
        type: string
        description: |
          ID of the property estimation to connect the done estimation in the core banking system with the estimation of the tpp in the
          external estimation tool.
        example: asd23f
      estimationSourceType:
        type: string
        example: iazi
        enum:
          - iazi
          - wup
      marketValue:
        $ref: ./Amount.yaml
        description: The estimated Market value of the property.
      statisticalPriceRangeMax:
        $ref: ./Amount.yaml
        description: The estimated upper limit of the statistical price range for the property.
      statisticalPriceRangeMin:
        $ref: ./Amount.yaml
        description: The estimated lower limit of the statistical price range for the property.
      yearlyRentalIncome:
        $ref: ./Amount.yaml
        description: The estimated annual rental income the property can generate.
      estimationDate:
        $ref: ./generic/Date.yaml
  floorPlan:
    type: string
    enum:
      - efficient
      - average
      - inefficient
    description: The efficiency rating of the property’s floor plan.
    example: average
  heatEmission:
    description: Type of heat emission systems used in the property, such as floor heating, radiators, stoves, etc.
    type: array
    items:
      type: string
      enum:
        - floor
        - radiator
        - stove
        - other
      example: floor
  heatProduction:
    description: The type of heating system used to generate heat in the property, such as oil, gas, or renewable sources like solar or geothermal.
    type: array
    items:
      type: string
      enum:
        - oil
        - gas
        - biogas
        - wood
        - electric
        - geothermal_probe
        - heat_pump_water_water
        - heat_pump_air_water
        - district
        - district_fossil
        - solar_panel
        - solar_thermal_collector
        - block_type_thermal_power_station
        - block_type_thermal_power_station_bio
      description: Type of the heat production.
      example: gas
  investmentCost:
    $ref: ./Amount.yaml
    description: The total amount required to purchase the property and complete any planned renovations (total Anlagekosten).
  limitForLandEncumbrances:
    $ref: ./Amount.yaml
    description: The limit for land encumbrance according to Bundesgericht über das bäuerliche Bodenrecht, SR 211.412.11 (Belastungsgrenze BGBB).
  matrimonialPropertyScheme:
    type: string
    example: separateEstate
    enum:
      - jointEstate
      - separateEstate
      - contributionToJointlyAcquiredProperty
    description: The property ownership arrangement, such as joint estate or separate estate.
  name:
    type: string
    description: A user-defined name for the property.
    example: My Nice Property
  objectPrice:
    $ref: ./Amount.yaml
    description: The price paid to purchase the property.
  outsideConstructionZone:
    type: boolean
    description: Indicates whether the property is located outside the designated construction zone.
    example: false
  propertyBuildingInformation:
    type: object
    description: Detailed building information about the property, such as living space, garage volume, and land area.
    properties:
      livingSpace:
        type: object
        properties:
          livingSpaceInSqm:
            type: integer
            description: The area of the living space in square meters.
            example: 120
          measurementStandard:
            type: string
            enum:
              - nla
              - gfa
            description: The measurement standard used to determine the living space (nla or gfa).
            example: nla
      roofFloorExpandable:
        type: boolean
        description: Indicates whether the roof floor can be expanded (true) or not (false).
        example: false
      volumeIncludingGarageInhouse:
        type: integer
        description: The total volume of the house, including any in-house garages (relevant for WuP).
        example: 1500
      volumeIncludingAllGarages:
        type: integer
        description: The total volume of the house, including in-house and external garages (relevant for IAZI).
        example: 1620
      landArea:
        type: integer
        description: The total surface area of the land.
        example: 2000
      environmentStandard:
        type: string
        enum:
          - high-level
          - basic
          - low-level
        description: The environmental rating of the property.
        example: basic
      otherFeatures:
        type: array
        items:
          type: string
          enum:
            - barrier-free_living
            - automated_building_control
            - ventilation_system_without_minergie
            - indoor_pool
            - outdoor_pool
            - whirlpool_sauna
            - heated_conservatory
            - unheated_conservatory
            - security_system
            - chimney
            - passenger_elevator
            - freight_elevator
          description: Additional features and services of the property.
          example: outdoor_pool
      houseType:
        type: string
        enum:
          - detached_house
          - semidetached_house
          - row_house
          - row_corner_house
          - terrace_house
        description: The type of house, such as detached or semidetached.
        example: detached_house
      normType:
        type: string
        enum:
          - building_insurance
          - sia116
          - sia416
          - other
        description: The norm type.
        example: building_insurance
  propertyConstructionInformation:
    type: object
    description: Detailed construction information about the property, including the year of construction, renovation status, and specific renovations made to the property.
    properties:
      constructionYear:
        type: integer
        description: The year when the property was originally constructed.
        example: 1990
      renovation:
        type: boolean
        description: Indicates whether the property has undergone full renovation (true) or not (false).
        example: false
      renovationYear:
        type: integer
        description: The year in which the entire property was renovated, if applicable.
        example: 1990
        default: 0
      propertyRenovations:
        type: array
        items:
          type: object
          properties:
            refurbishmentComponentType:
              type: string
              enum:
                - total
                - interior_fittings_kitchen
                - interior_fittings_bathroom_sanitary
                - interior_fittings_floor_cover
                - interior_fittings_remaining
                - building_envelope_pitched_roof
                - building_envelope_flat_roof
                - building_services_heat_production
                - building_services_heat_emission
                - buildings_services_electrical_ventilation_elevator
                - work_on_surroundings
                - supporting_structure
                - building_envelope_windows
                - building_envelope_facade_balcony
                - interior_fittings
                - building_envelope
                - building_services
              description: Type of property component that has been renovated. Please use consistently either the detailed component types 
              (e.g., interior_fittings_floor_cover) or the simple component types (e.g., interior_fittings).
              example: interior_fittings_floor_cover
            yearOfRenovation:
              type: integer
              description: The year in which a component type of the property was renovated.
              example: 2015
              default: 0
            renovationCost:
              $ref: ./Amount.yaml
              description: The renovation cost for the respective component type.
      minergieStandardType:
        type: string
        enum:
          - none
          - minergie
          - minergie-p
          - minergie-eco
          - minergie-p-eco
          - minergie-a
          - minergie-a-eco
        description: The minergie standard. Defines the energy efficiency standard of the building.
        example: minergie-p
      BECCStandardType:
        type: string
        enum:
          - none
          - A
          - B
          - C
          - D
          - E
          - F
          - G
        description:  Energy certificate from Cantons. The energy rating of the building after renovation.
        example: B
      luxusFlag:
        type: string
        enum:
          - '0'
          - '0.5'
          - '1.0'
        description: |
          Used for object value calculation (e.g. IAZI) and indicates whether the object is luxury or not:
          - '0' = No
          - '0.5' = Partially
          - '1' = Yes
          Proposed Mapping of WuP-Values:
          - 1.0-4.0 => 0 (No)
          - 4.1-4.5 => 0.5 (Partially)
          - 4.6-5.0 => 1.0 (Yes)
        example: '0'
      constructionQualityType:
        $ref: ./PropertyObjectRatingType.yaml
      stateBuildingType:
        $ref: ./PropertyObjectRatingType.yaml
  propertyElements:
    type: object
    description: Detailed information about the property’s elements, such as room count, parking spaces, and additional features like garages and bathrooms.
    properties:
      numberOfRooms:
        type: number
        format: double
        description: The number of rooms in the property.
        example: 4.5
      numberOfRoomsInGrannyFlat:
        type: number
        format: double
        description: The number of the rooms in the granny flat (if applicable).
        example: 2.5
      roomCountType:
        type: string
        enum:
          - kitchen_not_counted
          - kitchen_half_room
          - kitchen_full_room
        description: Reflects the type of the room count type. For example, whether the kitchen is counted as a full room.
        example: kitchen_full_room
      numberOfFamilyBathrooms:
        type: integer
        description: The number of family bathrooms, typically containing a separate shower and a bathtub (optional: toilet).
        example: 2
      numberOfBathWC:
        type: integer
        description: The number of bathrooms , including a bath or a shower, a sink, and a toilet.
        example: 2
      numberOfGuestWC:
        type: integer
        description: The number of separate guest toilets with wash basin.
        example: 2
      numberOfExternalParking:
        type: integer
        description: The number of external parking spaces available.
        example: 2
      numberOfSeparateGarages:
        type: integer
        description: |
          The number of separate garages (covered parking spaces), located on the same property but not included in the 
          building volume of the house (separate building insurance policy).
        example: 2
      numberOfExternalSeparateGarages:
        type: integer
        description: The number of external separate garages (covered parking spaces) outside of the property.
        example: 2
      numberOfAttachedGarages:
        type: integer
        description: |
          The number of garages attached to the house and which are included in the building volume of the house (no
          separate building insurance policy).
        example: 2
      numberOfUndergroundCarParks:
        type: integer
        description: The number of underground parking spaces.
        example: 2
  propertyFlatInformation:
    type: object
    description: he property flat information, such as the number of flats, floors, and features specific to the flat.
    properties:
      numberOfFlats:
        type: integer
        description: The number of flats in the building.
        example: 10
      numberOfFloors:
        type: integer
        description: The number of floors in the building.
        example: 4
      stateApartmentType:
        $ref: ./PropertyObjectRatingType.yaml
      floor:
        type: integer
        description: The floor on which the flat is located.
        example: 2
      balconyOrTerraceArea:
        type: integer
        description: The area of the balcony or terrace in square meters.
        example: 20
      livingSpace:
        type: object
        properties:
          livingSpaceInSqm:
            type: integer
            description: The area of the living space in square meters
            example: 120
          measurementStandard:
            type: string
            enum:
              - nla
              - gfa
            description: The measurement standard used to determine the living space (nla or gfa).
            example: nla
      multistorey:
        type: boolean
        description: Indicates if the flat is multi-storey (true) or not (false).
        example: false
      otherFeatures:
        type: array
        items:
          type: string
          enum:
            - coowned_garden_terrace_room
            - coowned_indoor_pool
            - coowned_outdoor_pool
            - whirlpool_sauna
            - heated_conservatory
            - unheated_conservatory
            - security_system
            - chimney
            - elevator_in_stairwell
            - elevator_into_apartment
            - barrier-free_living
            - automated_building_control
            - ventilation_system_without_minergie
          description: Additional features and services associated with the flat, such as a garden, pool, or security system.
          example: coowned_outdoor_pool
      quote:
        type: integer
        description: The proportion of the flat’s value relative to the entire building property.
        example: 120
      apartmentType:
        type: string
        enum:
          - garden_flat
          - floor_flat
          - roof_flat
          - attic
        description: The type of the apartment (e.g., garden flat, floor flat, roof flat, attic).
        example: floor_flat
      buildingType:
        type: string
        enum:
          - multiple_family_house
          - terrace_house
        description: The type of building in which the flat is located (e.g., multi-family house, terrace house).
        example: multiple_family_house
      locationInTheBuildingRating:
        $ref: ./PropertyObjectRatingType.yaml
  propertyIdentifier:
    $ref: ./PropertyIdentifier.yaml
  propertyLinks:
    description: A list of links to external resources related to the property, such as documents, plans, or external data sources.
    type: array
    items:
      $ref: ./Link.yaml
  propertyType:
    $ref: ./PropertyType.yaml
  publicNotarization:
    $ref: ./generic/Date.yaml
    description: Date of public notarization.
  remarks:
    type: string
    description: Additional comments or remarks related to the property estimation, such as conditions or special circumstances.
    example: We need an example for such a remark
  renovationAmount:
    $ref: ./Amount.yaml
    description: Amount needed to pay for the planned renovation (Renovationsbetrag)
  transferOfOwnershipDate:
    $ref: ./generic/Date.yaml
    description: The date when the property will be fully transferred to the new owner.
  usageType:
    $ref: ./UsageType.yaml
  valueRelevantServitudes:
    type: boolean
    description: Indicates whether the property has servitudes that may affect its value (true or false).
    example: false
