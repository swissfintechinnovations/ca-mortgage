description: The current interest rate and optionally the base rate to which the margin is applied.
type: object
required:
  - currentRate
properties:
  currentRate:
    type: number
    format: double
    description: |
      The interest rate expressed as a decimal. For example, 2.45% would be represented as 0.0245. For flexible interest mortgage this would show the margin above interest.
    minimum: 0
    maximum: 1
    example: 0.5
  base:
    type: number
    format: double
    description: The reference base rate to which the margin is applied (e.g. SARON rate).
    minimum: 0
    maximum: 1
    example: 0.5
