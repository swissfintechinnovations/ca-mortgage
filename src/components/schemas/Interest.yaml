description: The current rate and optionally the referred base.
type: object
required:
  - currentRate
properties:
  currentRate:
    $ref: ./generic/InterestRate.yaml
    description: |
      Interest rate in decimals. 2.45% would be sent as 0.0245. For flexible interest mortgage this would show the margin above interest.
  base:
    $ref: ./generic/InterestRate.yaml
    description: Base rate upon margin is applied (e.g. for SARON).
