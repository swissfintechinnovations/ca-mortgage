description: Complete financing details for an application, including the amount, amortization, financing IDs, and associated assets.
type: object
required:
  - amount
properties:
  amount:
    $ref: ./Amount.yaml
  amortizations:
    $ref: ./Amortizations.yaml
  applicationIdRef:
    type: string
    format: uuid
    description: he UUID of the corresponding application for this financing.
    example: 6e61ff5d-3ffd-4254-a77d-73cc25d35e92
  financingId:
    type: string
    format: uuid
    description: The UUID of the financing itself.
    example: 6e61ff5d-3ffd-4254-a77d-73cc25d35e92
  increaseAmount:
    $ref: ./Amount.yaml
  increasePurpose:
    type: string
    description: The reason or purpose for the increase in financing (e.g., home renovation).
    example: renovation of the kitchen
  offerDate:
    $ref: ./generic/Date.yaml
  publicCertDate:
    $ref: ./generic/Date.yaml
  tranches:
    description: The mortgage tranches associated with the financing.
    type: array
    items:
      $ref: ./FinancingTranche.yaml
  usedAssets:
    type: array
    description: A list of assets used for the financing.
    items:
      $ref: ./UsedAsset.yaml
