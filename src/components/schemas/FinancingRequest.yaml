description: A financing request sent to the financial institution based on the application. Multiple financing requests can be made per application.
type: object
required:
  - amount
  - applicationId
properties:
  amount:
    $ref: ./Amount.yaml
  applicationId:
    $ref: ./ApplicationId.yaml
  financingRequestId:
    $ref: ./FinancingRequestId.yaml
  increaseAmount:
    $ref: ./Amount.yaml
  increasePurpose:
    type: string
    description: The reason or purpose for the increase in financing.
    example: renovation of the kitchen
  publicCertDate:
    $ref: ./generic/Date.yaml
  requestOfferType:
    description: The type of offer requested, either binding or indicative.
    type: string
    example: binding
    enum:
      - binding
      - indicative
  tranches:
    description: The financing amount can be distributed across one or more tranches.
    type: array
    items:
      type: object
      properties:
        trancheId:
          type: string
          format: uuid
          description: The UUID of the tranche.
          example: 51b017e1-5e59-4b58-a0a0-c638c87db463
        productId:
          $ref: ./ProductId.yaml
        productVariation:
          $ref: ./ProductVariation.yaml
        payOutDate:
          $ref: ./generic/Date.yaml
        amount:
          $ref: ./Amount.yaml
  usedAssets:
    description: A list of assets used as collateral or to support the financing request.
    type: array
    items:
      $ref: ./UsedAsset.yaml
