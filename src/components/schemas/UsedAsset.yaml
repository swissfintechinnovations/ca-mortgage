description: |
  Asset used by an applicant: An array of all assets that will be used in the financial request. At least, all of these assets must be 
  recorded in the asset array within the financial situation of the respective applicant.
type: object
required:
  - amount
  - applicantId
  - assetType
properties:
  amount:
    $ref: ./Amount.yaml
  applicantId:
    type: string
    format: uuid
    description: UUID v4 of the applicant (existing applicant within the current application).
    example: 576f8de3-6b30-4882-a7af-da2132a456cf
  assetType:
    $ref: ./AssetType.yaml
  assetProvider:
    $ref: ./AssetProvider.yaml
  insuranceSum:
    $ref: ./Amount.yaml
    description: The amount, which is insured within the life insurance.
  usageType:
    $ref: ./AssetUsageType.yaml
