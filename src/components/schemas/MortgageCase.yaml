description: A complete mortgage case that includes all relevant details of the application, case ID, and financing.
type: object
required:
  - application
  - caseId
  - financing
properties:
  application:
    $ref: ./Application.yaml
  caseId:
    $ref: ./CaseId.yaml
  financing:
    $ref: ./Financing.yaml
  remark:
    type: string
    example: All documents verified at TPP
    description: A remark or comment that can be added by the Third-Party Provider (TPP), such as notes about the application or verification process.
