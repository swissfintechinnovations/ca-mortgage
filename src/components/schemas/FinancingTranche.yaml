description: A tranche of a financing, representing a portion of the total financing amount with specific terms and conditions.
type: object
required:
  - amount
  - interest
  - interestRateType
  - payoutDate
properties:
  amount:
    $ref: ./Amount.yaml
  interest:
    $ref: ./Interest.yaml
  interestRateType:
    type: string
    description: The type of interest rate applied to this tranche.
    example: libor
    enum:
      - variable
      - libor
      - saron
      - fixed
  payoutDate:
    $ref: ./generic/Date.yaml
  amortizations:
    $ref: ./Amortizations.yaml
  duration:
    type: integer
    description:  The duration of the mortgage for this tranche, in years.
    example: 2
    minimum: 1
    maximum: 20
  maturityDate:
    $ref: ./generic/Date.yaml
  productIdRef:
    type: string
    format: uuid
    description: The UUID of the associated product for this tranche.
    example: 6e61ff5d-3ffd-4254-a77d-73cc25d35e92
  saronperiod:
    type: string
    description: The SARON (Swiss Average Rate Overnight) period for variable interest rate tranches.
    example: 3m
    enum:
      - 1m
      - 3m
      - 6m
      - 12m
