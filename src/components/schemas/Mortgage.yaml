description: All relevant information regarding a specific mortgage, including details on the mortgage amount, interest rate, validity, and associated property.
type: object
required:
  - amountAtExpiry
  - durationType
  - interestBasis
  - interestRate
  - interestRateType
  - mortgageId
  - product
  - prolongable
  - propertyObjects
  - validFrom
  - validTo
properties:
  amountAtExpiry:
    $ref: ./Amount.yaml
  durationType:
    type: integer
    description: The duration of the mortgage in years.
    minimum: 0
    maximum: 25
    example: 5
  interestBasis:
    type: string
    description: The basis on which the interest is calculated (e.g., daily, monthly).
    example: Daily
  interestRate:
    type: string
    description: The interest rate to be paid by debtor.
    example: '1.4'
  interestRateType:
    type: string
    description: The type of interest rate applied to the mortgage.
    example: libor
    enum:
      - variable
      - libor
      - saron
      - fixed
  mortgageId:
    $ref: ./MortgageId.yaml
    description: UUID v4 identifier of the specific mortgage.
  product:
    $ref: ./Product.yaml
  prolongable:
    description: Indicates whether the mortgage can be prolonged.
    type: boolean
    example: false
  propertyObjects:
    type: array
    description: ..
    items:
      $ref: ./PropertyObject.yaml
  validFrom:
    $ref: ./generic/Date.yaml
  validTo:
    $ref: ./generic/Date.yaml
  amountToday:
    $ref: ./Amount.yaml
  offerDate:
    $ref: ./generic/Date.yaml
    description: |
      The date when the mortgage offer is made by the financial institution (FI). This is an optional field, typically used in cases where no separate MortgageOffer object is available.
    example: '2018-04-05'
  relatedMortgages:
    type: array
    description: A list of mortgages related to this mortgage (e.g., linked loans or second mortgages).
    items:
      $ref: ./Mortgage.yaml
