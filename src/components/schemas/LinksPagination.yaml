description: Links (or cursors) returned in the response of an API call, used for navigating through paginated results.
type: object
properties:
  first:
    type: string
    description: Link or cursor to the first set of results, based on the pagination parameters used in the request.
    example: /mortgage-app/api/v1/products?offset=0&limit=25
  last:
    type: string
    description: Link or cursor to the last set of results, based on the pagination parameters used in the request.
    example: /mortgage-app/api/v1/products?offset=150&limit=25
  next:
    type: string
    description: Link or cursor to the next set of results, based on the pagination parameters used in the request.
    example: /mortgage-app/api/v1/products?offset=100&limit=25
  previous:
    type: string
    description: Link or cursor to the previous set of results, based on the pagination parameters used in the request.
    example: /mortgage-app/api/v1/products?offset=50&limit=25
  self:
    type: string
    description: ink or cursor to the current set of results, based on the pagination parameters used in the request.
    example: /mortgage-app/api/v1/products?offset=75&limit=25
