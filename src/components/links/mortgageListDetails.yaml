operationId: getMortgage
description: |
  Details of the selected mortgage.
  The `mortgageId` of any entry in the `mortgageList` array can be used as the `mortgageId` path parameter.
  The expression below addresses the first entry; it applies to every entry alike.

  Example: `GET /mortgages/4bf92636-14a0-4511-98e2-acfde576e644`
parameters:
  mortgageId: $response.body#/mortgageList/0/mortgageId
