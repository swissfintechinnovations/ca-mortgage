operationId: updateApplication
description: |
  Update the details of the application.
  The `application.applicationId` returned in the response can be used as the `applicationId` path parameter.

  Example: `PUT /mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644`
parameters:
  applicationId: $response.body#/application/applicationId
