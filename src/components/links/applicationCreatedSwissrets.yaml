operationId: getApplicationInSwissrets
description: |
  Property details of the application in SwissRETS format.
  The `id` returned in the response can be used as the `applicationId` path parameter.

  Example: `GET /mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644/swissrets`
parameters:
  applicationId: $response.body#/id
