operationId: addApplicationInSwissrets
description: |
  Add property details in SwissRETS format to the application.
  The `application.applicationId` returned in the response can be used as the `applicationId` path parameter.

  Example: `POST /mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644/swissrets`
parameters:
  applicationId: $response.body#/application/applicationId
