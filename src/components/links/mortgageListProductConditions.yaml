operationId: listProductConditions
description: |
  General conditions of the selected mortgage product.
  The `product.productId` of any entry in the `mortgageList` array can be used as the `productId` path parameter.
  The expression below addresses the first entry; it applies to every entry alike.

  Example: `GET /mortgages/products/4bf92636-14a0-4511-98e2-acfde576e644/conditions`
parameters:
  productId: $response.body#/mortgageList/0/product/productId
