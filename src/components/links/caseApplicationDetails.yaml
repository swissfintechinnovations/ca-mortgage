operationId: getApplication
description: |
  Details of the application.
  The `Case.application.applicationId` returned in the response can be used as the `applicationId` path parameter.

  Example: `GET /mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644`
parameters:
  applicationId: $response.body#/Case/application/applicationId
