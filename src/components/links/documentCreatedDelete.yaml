operationId: deleteApplicationDocument
description: |
  Delete the selected document of the application.
  The `id` returned in the response can be used as the `documentId` path parameter.
  The `applicationId` is taken from the path of the request.

  Example: `DELETE /mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644/documents/4bf92636-14a0-4511-98e2-acfde576e644`
parameters:
  applicationId: $request.path.applicationId
  documentId: $response.body#/id
