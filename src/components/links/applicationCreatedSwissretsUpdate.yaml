operationId: updateApplicationInSwissrets
description: |
  Update the property details in SwissRETS format of the application.
  The `id` returned in the response can be used as the `applicationId` path parameter.

  Example: `PUT /mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644/swissrets`
parameters:
  applicationId: $response.body#/id
