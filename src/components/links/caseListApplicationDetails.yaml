operationId: getApplication
description: |
  Details of the application.
  The `application.applicationId` of any entry in the `caseList` array can be used as the `applicationId` path parameter.
  The expression below addresses the first entry; it applies to every entry alike.

  Example: `GET /mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644`
parameters:
  applicationId: $response.body#/caseList/0/application/applicationId
