operationId: listApplicationFinancingRequestRequiredInformation
description: |
  Documents and information required by the FI to process the financing request.
  The `id` returned in the response can be used as the `financingRequestId` path parameter.
  The `applicationId` is taken from the path of the request.

  Example: `GET`
  `/mortgages/applications/4bf92636-14a0-4511-98e2-acfde576e644/financing-requests/4bf92636-14a0-4511-98e2-acfde576e644/required-information`
parameters:
  applicationId: $request.path.applicationId
  financingRequestId: $response.body#/id
